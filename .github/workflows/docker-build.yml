name: Docker Build

on:
  push:
    branches: [codex/mcp-oauth-build]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: 593e0c77d29be3fa82a2cc4b2f08e89b082da5d6
  DOCKER_REPO: ghcr.io/mfroembgen/radar

jobs:
  docker:
    if: github.repository == 'mfroembgen/radar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Prepare native multi-platform build
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          lines = Path("Dockerfile").read_text().splitlines()
          replacements = (
              ("FROM node:24-alpine AS frontend-builder", "FROM --platform=$BUILDPLATFORM node:24-alpine AS frontend-builder"),
              ("FROM golang:1.26-alpine AS backend-builder", "FROM --platform=$BUILDPLATFORM golang:1.26-alpine AS backend-builder"),
              ("ARG TARGETOS=linux", "ARG TARGETOS"),
              ("ARG TARGETARCH=amd64", "ARG TARGETARCH"),
          )
          for expected, replacement in replacements:
              if lines.count(expected) != 1:
                  raise SystemExit(f"Expected exactly one Dockerfile line: {expected}")
              lines[lines.index(expected)] = replacement
          Path("Dockerfile.mcp-oauth").write_text("\n".join(lines) + "\n")
          PYTHON
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp-oauth
          platforms: linux/amd64,linux/arm64
          target: full
          push: true
          build-args: |
            VERSION=mcp-oauth-${{ env.SOURCE_SHA }}
          tags: ${{ env.DOCKER_REPO }}:mcp-oauth-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/mfroembgen/radar
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
