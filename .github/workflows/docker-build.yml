name: Docker Build

on:
  push:
    branches: [codex/mcp-oauth-build]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: 593e0c77d29be3fa82a2cc4b2f08e89b082da5d6
  DOCKER_REPO: ghcr.io/mfroembgen/radar

jobs:
  docker:
    if: github.repository == 'mfroembgen/radar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: full
          push: true
          build-args: |
            VERSION=mcp-oauth-${{ env.SOURCE_SHA }}
          tags: ${{ env.DOCKER_REPO }}:mcp-oauth-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/mfroembgen/radar
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
